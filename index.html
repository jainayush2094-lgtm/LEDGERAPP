<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Ledger — Capture</title>

<!-- ===== PWA WIRING ===== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8e9ee">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* ================= THEME TOKENS ================= */
html[data-theme="light"]{
  --bg:#e8e9ee; --raised:#ffffff; --inset:#e7e8ed;
  --ink:#1c1d22; --muted:#878a93; --faint:#b6b9c1;
  --active:#1a1a1c; --active-ink:#ffffff;
  --sd:rgba(170,174,190,.55); --sl:rgba(255,255,255,.95);
  --line:rgba(0,0,0,.05);
  --pos:#2f9e6f; --neg:#cf6b6b;
  --pos-soft:rgba(47,158,111,.13); --neg-soft:rgba(207,107,107,.13);
  --note:#3b73d6;
  --r:20px;
}
html[data-theme="dark"]{
  --bg:#23252b; --raised:#262931; --inset:#202229;
  --ink:#eceef2; --muted:#8b8f99; --faint:#565a64;
  --active:#f0f1f4; --active-ink:#1a1a1c;
  --sd:rgba(0,0,0,.5); --sl:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.06);
  --pos:#5fb98a; --neg:#d98484;
  --pos-soft:rgba(95,185,138,.16); --neg-soft:rgba(217,132,132,.16);
  --note:#6f9bf2;
  --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Manrope',sans-serif; background:var(--bg); color:var(--ink);
  min-height:100vh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  overflow-x:hidden; transition:background .35s,color .35s;
}
.wrap{max-width:560px;margin:0 auto;padding:24px 18px 100px}

/* neumorphic helpers */
.raised{background:var(--raised);box-shadow:6px 6px 14px var(--sd),-6px -6px 14px var(--sl)}
.inset{background:var(--inset);box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl)}

/* ================= HEADER ================= */
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.title h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.title p{font-size:12px;color:var(--muted);margin-top:2px;font-weight:500}
.tbtn{width:46px;height:46px;border:none;border-radius:14px;background:var(--raised);
  box-shadow:6px 6px 12px var(--sd),-6px -6px 12px var(--sl);color:var(--ink);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:box-shadow .15s,transform .1s}
.tbtn:active{box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl);transform:scale(.97)}

/* ================= TABS (Storage/Inactive pill bar) ================= */
.tabbar{display:flex;gap:6px;padding:7px;border-radius:999px;background:var(--raised);
  box-shadow:6px 6px 14px var(--sd),-6px -6px 14px var(--sl);margin-bottom:18px}
.tab{flex:1;border:none;background:transparent;color:var(--muted);font-family:'Manrope';font-weight:700;
  font-size:14.5px;padding:12px 8px;border-radius:999px;cursor:pointer;transition:all .2s;letter-spacing:-.01em}
.tab.active{background:var(--active);color:var(--active-ink);box-shadow:3px 3px 8px var(--sd)}

/* ================= SUMMARY ================= */
.balance{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.bcard{border-radius:var(--r);padding:16px 16px;background:var(--raised);cursor:pointer;
  box-shadow:6px 6px 16px var(--sd),-6px -6px 16px var(--sl);transition:transform .1s}
.bcard:active{transform:scale(.985)}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:6px}
.blab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bedit{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;
  background:var(--inset);padding:3px 7px;border-radius:7px;box-shadow:inset 2px 2px 4px var(--sd),inset -2px -2px 4px var(--sl)}
.bval{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:23px;margin-top:11px;color:var(--ink);font-variant-numeric:tabular-nums}
.bval.neg{color:var(--neg)}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.scard{border-radius:var(--r);padding:15px 16px;background:var(--raised);
  box-shadow:6px 6px 14px var(--sd),-6px -6px 14px var(--sl)}
.scard .lab{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.scard .val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;margin-top:7px;font-variant-numeric:tabular-nums}
.scard .val.pos{color:var(--pos)} .scard .val.neg{color:var(--neg)}
.scard.wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.scard.wide .val{font-size:16px;margin-top:0}
.pendpill{font-family:'Manrope';font-weight:700;font-size:12px;color:var(--active-ink);background:var(--active);
  padding:7px 13px;border-radius:999px}

/* ================= CHIPS ================= */
.chips{display:flex;gap:8px;margin-bottom:16px}
.chip{flex:1;border:none;background:var(--raised);color:var(--muted);font-family:'Manrope';font-weight:700;
  font-size:12.5px;padding:10px 6px;border-radius:13px;cursor:pointer;
  box-shadow:4px 4px 9px var(--sd),-4px -4px 9px var(--sl);transition:all .18s}
.chip.active{background:var(--active);color:var(--active-ink)}
.chip .n{font-family:'JetBrains Mono',monospace;opacity:.65;margin-left:3px}

/* ================= FILTER BAR (category + method) ================= */
.filterbar{display:flex;gap:8px;margin-bottom:14px}
.filterbar select{flex:1;min-width:0;border:none;border-radius:12px;padding:10px 12px;color:var(--ink);
  font-family:'Manrope';font-weight:700;font-size:12.5px;background:var(--inset);
  box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl);
  appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
.filterbar select:focus{outline:none}
.filterbar select.set{color:var(--ink);background-image:linear-gradient(45deg,transparent 50%,var(--active) 50%),linear-gradient(135deg,var(--active) 50%,transparent 50%);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--active) 45%,transparent),inset 3px 3px 7px var(--sd)}

/* ================= ADD BUTTON ================= */
.addbtn{width:100%;border:none;border-radius:16px;background:var(--active);color:var(--active-ink);
  font-family:'Manrope';font-weight:700;font-size:15px;padding:16px;cursor:pointer;margin-bottom:18px;
  box-shadow:6px 6px 14px var(--sd),-6px -6px 14px var(--sl);transition:transform .1s,box-shadow .15s;letter-spacing:-.01em}
.addbtn:active{transform:scale(.99);box-shadow:3px 3px 9px var(--sd)}

/* ================= COLLAPSED ROW ================= */
.card{border-radius:16px;margin-bottom:10px;background:var(--raised);
  box-shadow:5px 5px 13px var(--sd),-5px -5px 13px var(--sl);transition:opacity .2s,transform .2s}
.rowhead{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer}
.rowdot{flex:0 0 auto;width:11px;height:11px;border-radius:50%;background:var(--neg)}
.card.is-entered .rowdot{background:var(--pos)}
.rowamt{flex:0 0 auto;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;color:var(--ink);min-width:74px}
.rowmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rowcat{font-weight:700;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowcat .placeholder{color:var(--faint);font-weight:600;font-style:italic}
.rowsub{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.rownote{font-size:12px;font-weight:600;color:var(--note);margin-top:3px;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rownote:empty{display:none}
.rowchev{flex:0 0 auto;width:18px;height:18px;color:var(--faint);transition:transform .22s}
.card.open .rowchev{transform:rotate(180deg)}
.cardbody{max-height:0;overflow:hidden;transition:max-height .28s ease}
.cardbody-inner{padding:2px 14px 14px}

/* ================= ENTRY CARD (expanded body) ================= */
.crow1{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.amtwrap{flex:1;display:flex;align-items:center;gap:7px;border-radius:14px;padding:11px 14px;
  background:var(--inset);box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl)}
.amtwrap .cur{font-family:'JetBrains Mono';font-weight:700;font-size:18px;color:var(--muted)}
.amt{flex:1;border:none;background:transparent;color:var(--ink);font-family:'JetBrains Mono',monospace;
  font-weight:700;font-size:21px;width:100%;min-width:0}
.amt:focus{outline:none}
.amt::placeholder{color:var(--faint)}

/* entered-to-software checkmark (the "Check" element) */
.check{flex:0 0 auto;width:50px;height:50px;border:none;border-radius:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;background:var(--inset);
  box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl);
  color:var(--faint);transition:all .2s}
.check svg{width:22px;height:22px}
.check.on{background:var(--active);color:var(--active-ink);
  box-shadow:4px 4px 10px var(--sd),-4px -4px 10px var(--sl)}

/* labeled "Entered in Zoho" toggle row — RED = not entered, GREEN = entered */
.zoho-row{width:100%;display:flex;align-items:center;justify-content:space-between;border:none;cursor:pointer;
  border-radius:14px;padding:13px 15px;margin-bottom:6px;font-family:'Manrope';transition:all .2s;
  background:var(--neg-soft);box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl)}
.zoho-row .zlabel{font-weight:700;font-size:14px;letter-spacing:-.01em;color:var(--neg)}
.zoho-row .zlabel::before{content:"Not entered in Zoho"}
.zoho-row .zcheck{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:var(--neg);color:#fff;box-shadow:2px 2px 5px var(--sd),-2px -2px 5px var(--sl);transition:all .2s}
.zoho-row .zcheck svg{width:17px;height:17px;opacity:0;transition:opacity .2s}
.zoho-row.on{background:var(--pos-soft);box-shadow:4px 4px 11px var(--sd),-4px -4px 11px var(--sl)}
.zoho-row.on .zlabel{color:var(--pos)}
.zoho-row.on .zlabel::before{content:"Entered in Zoho"}
.zoho-row.on .zcheck{background:var(--pos);color:#fff}
.zoho-row.on .zcheck svg{opacity:1}

/* scope segmented toggle */
.seg{display:flex;gap:5px;padding:5px;border-radius:13px;margin-bottom:11px;background:var(--inset);
  box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl)}
.seg button{flex:1;border:none;background:transparent;color:var(--muted);font-family:'Manrope';font-weight:700;
  font-size:12.5px;padding:9px;border-radius:9px;cursor:pointer;transition:all .18s}
.seg button.sel{background:var(--raised);color:var(--ink);box-shadow:3px 3px 7px var(--sd),-3px -3px 7px var(--sl)}

.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
.fld label{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin-bottom:5px;margin-left:3px}
.fld select,.fld input{width:100%;border:none;border-radius:12px;padding:11px 12px;color:var(--ink);
  font-family:'Manrope';font-weight:600;font-size:13.5px;background:var(--inset);
  box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl)}
.fld select:focus,.fld input:focus{outline:none}
.fld select{appearance:none;-webkit-appearance:none;cursor:pointer}
.fld.full{grid-column:1/-1}

.notewrap{position:relative;margin-bottom:6px}
.note{width:100%;border:none;border-radius:13px;padding:12px 38px 12px 13px;color:var(--ink);
  font-family:'Manrope';font-weight:500;font-size:13.5px;line-height:1.5;resize:vertical;min-height:44px;
  background:var(--inset);box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl)}
.note:focus{outline:none}
.note::placeholder{color:var(--faint)}
.noteclear{position:absolute;top:9px;right:9px;width:24px;height:24px;border:none;border-radius:8px;
  background:var(--raised);color:var(--muted);cursor:pointer;font-size:13px;line-height:1;
  box-shadow:2px 2px 5px var(--sd),-2px -2px 5px var(--sl);display:none}
.noteclear.show{display:flex;align-items:center;justify-content:center}

.cfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.stamp{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--faint);letter-spacing:.04em}
.del{border:none;background:transparent;color:var(--faint);font-family:'Manrope';font-weight:700;
  font-size:11.5px;cursor:pointer;padding:5px 8px;border-radius:9px}
.del:active{color:var(--neg)}

.empty{text-align:center;color:var(--muted);font-size:14px;padding:46px 14px;font-weight:500}
.empty b{display:block;color:var(--ink);font-weight:700;font-size:16px;margin-bottom:6px}

footer{text-align:center;margin-top:24px;font-family:'JetBrains Mono',monospace;font-size:10px;
  color:var(--faint);letter-spacing:.1em}
footer a{color:var(--muted);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--faint)}
.hid{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>Ledger</h1>
      <p>Capture now · post to Zoho later</p>
    </div>
    <button class="tbtn" id="themeBtn" onclick="toggleTheme()">☾</button>
  </header>

  <div class="tabbar">
    <button class="tab active" data-type="expense" onclick="setType('expense',this)">Expenses</button>
    <button class="tab" data-type="received" onclick="setType('received',this)">Received</button>
  </div>

  <div class="balance">
    <div class="bcard" onclick="editOpening('cash')">
      <div class="bhead"><span class="blab">Cash in hand</span><span class="bedit">edit start</span></div>
      <div class="bval num" id="bCash">₹0</div>
    </div>
    <div class="bcard" onclick="editOpening('bank')">
      <div class="bhead"><span class="blab">Bank balance</span><span class="bedit">edit start</span></div>
      <div class="bval num" id="bBank">₹0</div>
    </div>
  </div>

  <div class="summary">
    <div class="scard"><div class="lab">Spent · this month</div><div class="val neg" id="sExp">₹0</div></div>
    <div class="scard"><div class="lab">Received · this month</div><div class="val pos" id="sRec">₹0</div></div>
    <div class="scard wide">
      <div><div class="lab">Net this month</div><div class="val" id="sNet">₹0</div></div>
    </div>
  </div>

  <div class="chips" id="chips">
    <button class="chip active" data-f="all" onclick="setFilter('all',this)">All <span class="n" id="c-all">0</span></button>
    <button class="chip" data-f="business" onclick="setFilter('business',this)">Business <span class="n" id="c-business">0</span></button>
    <button class="chip" data-f="personal" onclick="setFilter('personal',this)">Personal <span class="n" id="c-personal">0</span></button>
    <button class="chip" data-f="pending" onclick="setFilter('pending',this)">Pending <span class="n" id="c-pending">0</span></button>
  </div>

  <div class="filterbar">
    <select id="catFilter" onchange="setCatFilter(this.value)"></select>
    <select id="methFilter" onchange="setMethFilter(this.value)">
      <option value="">All methods</option>
      <option value="Cash">Cash</option>
      <option value="Bank Transfer">Bank Transfer</option>
    </select>
  </div>

  <button class="addbtn" id="addBtn" onclick="addEntry()">＋  Add expense</button>

  <div id="list"></div>

  <footer>
    ON-DEVICE · v6 &nbsp;·&nbsp;
    <a onclick="exportData()">Backup</a> &nbsp;·&nbsp;
    <a onclick="document.getElementById('imp').click()">Restore</a>
    <input id="imp" class="hid" type="file" accept="application/json" onchange="importData(event)">
  </footer>
</div>

<script>
/* ================= CONFIG ================= */
const CATS = {
  expense: ["Inventory / Stock","Transport / Freight","Salary / Wages","Rent","Utilities",
            "Marketing","Office Supplies","Repairs / Maintenance","Travel","Food","GST / Tax","Personal","Other"],
  received: ["Customer Payment","Dealer Payment","Advance","Refund","Interest","Personal","Other"]
};
const METHODS = ["Cash","Bank Transfer"];
const KEY='ledger_capture_v1', TKEY='ledger_theme', OKEY='ledger_opening_v1';

/* ================= STATE ================= */
let items=[]; try{items=JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){items=[];}
let opening={cash:0,bank:0}; try{const o=JSON.parse(localStorage.getItem(OKEY));if(o&&typeof o.cash==='number')opening=o;}catch(e){}
let curType='expense', filter='all', catFilter='', methFilter='';

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){}};
const saveOpening=()=>{try{localStorage.setItem(OKEY,JSON.stringify(opening));}catch(e){}};
function editOpening(which){
  const label = which==='cash' ? 'cash in hand' : 'bank';
  const cur = opening[which]||0;
  const val = prompt('Starting '+label+' balance (₹).\nEnter your real balance before you began logging:', cur);
  if(val===null) return;
  const n = parseFloat(String(val).replace(/[, ₹]/g,''));
  if(isNaN(n)){ alert('Please enter a number.'); return; }
  opening[which]=n; saveOpening(); refreshSummary();
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmt=n=>{const v=Math.round(parseFloat(n)||0);return '₹'+v.toLocaleString('en-IN');};
const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const niceDate=s=>{if(!s)return '';const[y,m,d]=s.split('-');const mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return d+' '+mo[+m-1]+" '"+y.slice(2);};

/* ================= THEME ================= */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeBtn').textContent=(t==='light')?'☾':'☀';
  document.querySelector('meta[name=theme-color]').setAttribute('content',t==='light'?'#e8e9ee':'#23252b');
}
function toggleTheme(){const n=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';applyTheme(n);try{localStorage.setItem(TKEY,n);}catch(e){}}
applyTheme(localStorage.getItem(TKEY)||'light');

/* ================= TABS / FILTER ================= */
function setType(t,btn){
  curType=t; filter='all';
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.f==='all'));
  document.getElementById('addBtn').textContent = t==='expense' ? '＋  Add expense' : '＋  Add payment received';
  catFilter=''; methFilter='';
  populateCatFilter();
  document.getElementById('methFilter').value='';
  document.getElementById('methFilter').classList.remove('set');
  render();
}
function setFilter(f,btn){filter=f;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));btn.classList.add('active');applyFilterAll();}
function setCatFilter(v){catFilter=v;document.getElementById('catFilter').classList.toggle('set',!!v);applyFilterAll();}
function setMethFilter(v){methFilter=v;document.getElementById('methFilter').classList.toggle('set',!!v);applyFilterAll();}
function populateCatFilter(){
  const sel=document.getElementById('catFilter');
  sel.innerHTML='<option value="">All categories</option>'+CATS[curType].map(c=>`<option value="${c}">${c}</option>`).join('');
  sel.value=''; sel.classList.remove('set');
}

/* ================= ADD ================= */
function addEntry(){
  const it={id:uid(),type:curType,amount:'',cat:'',scope:'business',method:'Cash',date:today(),note:'',entered:false};
  items.unshift(it); save(); render(true);
}

/* ================= CARD ================= */
function rowSummary(it){
  const amt = it.amount ? '₹'+Number(it.amount).toLocaleString('en-IN') : '₹0';
  const cat = it.cat ? esc(it.cat) : '<span class="placeholder">No category</span>';
  const m = it.method || 'Cash';
  const sub = `${m} · ${it.scope==='personal'?'Personal':'Business'} · ${niceDate(it.date)}`;
  const note = it.note ? esc(it.note.trim()) : '';
  return {amt,cat,sub,note};
}
function cardHTML(it){
  const cats=['<option value="">Category…</option>'].concat(CATS[it.type].map(c=>`<option ${it.cat===c?'selected':''}>${c}</option>`)).join('');
  const meths=METHODS.map(m=>`<option ${it.method===m?'selected':''}>${m}</option>`).join('');
  const s=rowSummary(it);
  return `<div class="card ${it.entered?'is-entered':''}" data-id="${it.id}">
    <div class="rowhead">
      <span class="rowdot"></span>
      <span class="rowamt">${s.amt}</span>
      <span class="rowmid"><span class="rowcat">${s.cat}</span><span class="rowsub">${s.sub}</span><span class="rownote">${s.note}</span></span>
      <svg class="rowchev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="cardbody"><div class="cardbody-inner">
      <div class="crow1">
        <div class="amtwrap"><span class="cur">₹</span>
          <input class="amt" inputmode="decimal" placeholder="0" value="${esc(it.amount)}" data-k="amount"></div>
      </div>
      <div class="seg">
        <button class="${it.scope==='business'?'sel':''}" data-scope="business">Business</button>
        <button class="${it.scope==='personal'?'sel':''}" data-scope="personal">Personal</button>
      </div>
      <div class="frow">
        <div class="fld"><label>Category</label><select data-k="cat">${cats}</select></div>
        <div class="fld"><label>Method</label><select data-k="method">${meths}</select></div>
        <div class="fld full"><label>Date</label><input type="date" data-k="date" value="${esc(it.date)}"></div>
      </div>
      <div class="notewrap">
        <textarea class="note" placeholder="Note — vendor, invoice no., what it was for…" data-k="note">${esc(it.note)}</textarea>
        <button class="noteclear ${it.note?'show':''}" title="Clear note">✕</button>
      </div>
      <button class="zoho-row ${it.entered?'on':''}" data-k="entered">
        <span class="zlabel"></span>
        <span class="zcheck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
      </button>
      <div class="cfoot">
        <span class="stamp">${it.entered?'ENTERED ✓':'PENDING'}</span>
        <button class="del">Delete</button>
      </div>
    </div></div>
  </div>`;
}
function refreshRow(card,it){
  const s=rowSummary(it);
  card.querySelector('.rowamt').textContent=s.amt;
  card.querySelector('.rowcat').innerHTML=s.cat;
  card.querySelector('.rowsub').textContent=s.sub;
  card.querySelector('.rownote').textContent=s.note;
  card.classList.toggle('is-entered',it.entered);
}
function toggleCard(card){
  const body=card.querySelector('.cardbody');
  const open=card.classList.toggle('open');
  body.style.maxHeight = open ? (body.firstElementChild.scrollHeight+8)+'px' : '0px';
}

function wire(card){
  const it=items.find(x=>x.id===card.dataset.id);
  // expand/collapse on row head tap
  card.querySelector('.rowhead').addEventListener('click',()=>toggleCard(card));
  card.querySelectorAll('[data-k]').forEach(el=>{
    if(el.dataset.k==='entered') return;
    const k=el.dataset.k, ev=(el.tagName==='SELECT'||el.type==='date')?'change':'input';
    el.addEventListener(ev,()=>{
      it[k]=el.value; save();
      refreshRow(card,it);
      if(k==='amount') refreshSummary();
      if(k==='note') card.querySelector('.noteclear').classList.toggle('show',!!el.value);
      if(k==='method'){ refreshSummary(); if(methFilter) applyFilterTo(card); }
      if(k==='cat'&&catFilter) applyFilterTo(card);
    });
  });
  // entered toggle
  const chk=card.querySelector('.zoho-row');
  chk.addEventListener('click',()=>{
    it.entered=!it.entered; save();
    chk.classList.toggle('on',it.entered);
    card.querySelector('.stamp').textContent=it.entered?'ENTERED ✓':'PENDING';
    refreshRow(card,it);
    refreshCounts();
    if(filter==='pending') applyFilterTo(card);
  });
  // scope
  card.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
    it.scope=b.dataset.scope; save();
    card.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('sel',x===b));
    refreshRow(card,it);
    refreshCounts();
    if(filter==='business'||filter==='personal') applyFilterTo(card);
  }));
  // note clear
  card.querySelector('.noteclear').addEventListener('click',()=>{
    it.note=''; save();
    const ta=card.querySelector('.note'); ta.value=''; ta.focus();
    card.querySelector('.noteclear').classList.remove('show');
  });
  // delete
  card.querySelector('.del').addEventListener('click',()=>{
    if(!confirm('Delete this entry?'))return;
    items=items.filter(x=>x.id!==it.id); save();
    card.style.opacity='0'; card.style.transform='scale(.97)';
    setTimeout(()=>{card.remove();refreshSummary();checkEmpty();},180);
  });
}

/* ================= RENDER ================= */
const listEl=document.getElementById('list');
function render(focusFirst){
  const rows=items.filter(x=>x.type===curType);
  listEl.innerHTML = rows.length ? rows.map(cardHTML).join('') : '';
  listEl.querySelectorAll('.card').forEach(wire);
  refreshSummary(); checkEmpty(); applyFilterAll();
  if(focusFirst){
    const first=listEl.querySelector('.card');
    if(first){ toggleCard(first); const f=first.querySelector('.amt'); if(f)f.focus(); first.scrollIntoView({behavior:'smooth',block:'center'}); }
  }
}
function checkEmpty(){
  if(!listEl.querySelector('.card')){
    listEl.innerHTML=`<div class="empty"><b>Nothing logged yet</b>Tap the button above to capture your first ${curType==='expense'?'expense':'payment'}.</div>`;
  }
}
function applyFilterAll(){listEl.querySelectorAll('.card').forEach(applyFilterTo);}
function applyFilterTo(card){
  const it=items.find(x=>x.id===card.dataset.id); if(!it)return;
  let show=true;
  if(filter==='business') show=it.scope==='business';
  else if(filter==='personal') show=it.scope==='personal';
  else if(filter==='pending') show=!it.entered;
  if(show&&catFilter) show=(it.cat===catFilter);
  if(show&&methFilter) show=((it.method||'Cash')===methFilter);
  card.style.display=show?'':'none';
}

/* ================= SUMMARY ================= */
function thisMonth(s){const n=new Date();return s&&s.slice(0,7)===n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');}
function methodKey(m){return m==='Cash'?'cash':'bank';}  // UPI/Card/Cheque/Bank Transfer all count as bank
function refreshSummary(){
  let exp=0,rec=0;
  // running balances start from opening balances, count ALL entries (not just this month)
  let bal={cash:opening.cash||0, bank:opening.bank||0};
  items.forEach(it=>{
    const a=parseFloat(it.amount)||0;
    const k=methodKey(it.method);
    if(it.type==='expense') bal[k]-=a; else bal[k]+=a;
    if(thisMonth(it.date)){ if(it.type==='expense')exp+=a; else rec+=a; }
  });
  // balance cards
  const bc=document.getElementById('bCash'), bb=document.getElementById('bBank');
  bc.textContent=(bal.cash<0?'−':'')+fmt(Math.abs(bal.cash)); bc.className='bval num'+(bal.cash<0?' neg':'');
  bb.textContent=(bal.bank<0?'−':'')+fmt(Math.abs(bal.bank)); bb.className='bval num'+(bal.bank<0?' neg':'');
  // monthly summary
  document.getElementById('sExp').textContent=fmt(exp);
  document.getElementById('sRec').textContent=fmt(rec);
  const net=rec-exp, ne=document.getElementById('sNet');
  ne.textContent=(net<0?'−':'')+fmt(Math.abs(net));
  ne.className='val '+(net>=0?'pos':'neg');
  refreshCounts();
}
function refreshCounts(){
  const rows=items.filter(x=>x.type===curType);
  const cnt={all:rows.length,
    business:rows.filter(x=>x.scope==='business').length,
    personal:rows.filter(x=>x.scope==='personal').length,
    pending:rows.filter(x=>!x.entered).length};
  for(const k in cnt){const el=document.getElementById('c-'+k);if(el)el.textContent=cnt[k];}
}

/* ================= BACKUP / RESTORE ================= */
function exportData(){
  const payload={opening:opening, items:items};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='ledger-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);
}
function importData(ev){
  const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    // new format: {opening, items}  |  old format: [ ...items ]
    const arr = Array.isArray(d) ? d : (d&&Array.isArray(d.items) ? d.items : null);
    if(arr){if(!confirm('Replace current data with backup ('+arr.length+' entries)?'))return;
      if(d&&d.opening&&typeof d.opening.cash==='number'){opening=d.opening;saveOpening();}
      items=arr.map(x=>({id:x.id||uid(),type:x.type==='received'?'received':'expense',amount:x.amount||'',
        cat:x.cat||'',scope:x.scope==='personal'?'personal':'business',method:x.method||'Cash',
        date:x.date||today(),note:x.note||'',entered:!!x.entered}));
      save();render();}
    else alert('That file is not a Ledger backup.');
  }catch(e){alert('Could not read that file.');}ev.target.value='';};
  r.readAsText(f);
}

/* ================= SW ================= */
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}

populateCatFilter();
render();
</script>
</body>
</html>
